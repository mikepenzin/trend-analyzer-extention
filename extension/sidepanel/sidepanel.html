<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trend Analyzer</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <!-- License gate (shown before everything else if no key is stored) -->
    <div id="license-gate" class="license-gate hidden">
      <div class="panel-card gate-card">
        <p class="eyebrow">Trend Analyzer</p>
        <h2 class="gate-title">Enter Access Key</h2>
        <p class="gate-hint">You need an invite key to use this extension.</p>
        <input id="license-key-input" type="password" class="input" placeholder="Access key…" autocomplete="current-password" />
        <button id="license-key-submit" class="action-button primary gate-submit">Unlock</button>
        <p id="license-key-error" class="gate-error hidden">Invalid key. Please try again.</p>
      </div>
    </div>

    <main class="app-shell">
      <header class="panel-card header-card">
        <p class="eyebrow">Trend Analyzer</p>
        <div class="header-title-row">
          <h1 id="page-title">Loading page...</h1>
          <span id="timeframe-badge" class="timeframe-badge hidden"></span>
        </div>
        <div class="header-actions">
          <button id="history-toggle" class="icon-button" title="Analysis history">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
        </div>
      </header>

      <!-- History panel (hidden by default) -->
      <section class="panel-card hidden" id="history-panel">
        <p class="eyebrow">Recent Analyses</p>
        <div id="history-list" class="history-list"></div>
      </section>

      <!-- Not TradingView state -->
      <div id="not-tradingview-state" class="panel-card not-tv-state hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="not-tv-icon"><path d="M3 3l18 18"/><path d="M22 12c0-5.52-4.48-10-10-10"/><path d="M2 12c0 5.52 4.48 10 10 10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <p class="not-tv-message">Open a <strong>TradingView</strong> chart to use Trend Analyzer.</p>
      </div>

      <!-- Settings row -->
      <!-- <div class="settings-row">
        <label class="settings-label">
          <span>Provider</span>
          <select id="provider-select" class="settings-select">
            <option value="gemini">Google Gemini</option>
            <option value="groq">Meta Llama</option>
            <option value="openai" selected>OpenAI ChatGPT</option>
          </select>
        </label>
      </div> -->

      <!-- Initial state: just the analyze button -->
      <section class="panel-card" id="initial-state">
        <button id="analyze-button" class="action-button primary" style="width: 100%;">
          Analyze this chart
        </button>
      </section>

      <!-- Loading state -->
      <div id="loading-state" class="panel-card status-text hidden">
        <span class="loading-dots"><span></span><span></span><span></span></span>
        <span class="loading-label">Analyzing</span>
      </div>

      <!-- Error state -->
      <div id="error-state" class="panel-card status-text error hidden"></div>

      <!-- Chat view: thread + input (shown after first analysis) -->
      <section class="panel-card hidden" id="chat-view">
        <div id="chat-thread"></div>
        <div class="chat-input-row">
          <div class="input-with-send">
            <input
              id="follow-up-input"
              type="text"
              class="input"
              placeholder="Ask a follow-up..."
            />
            <button id="send-follow-up" class="send-icon-btn" title="Send">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/></svg>
            </button>
          </div>
          <div class="chat-actions">
            <button id="reanalyze-button" class="action-button" title="Re-analyze current chart">Re-analyze</button>
            <button id="export-chat" class="action-button" title="Export chat as Markdown">Export</button>
            <button id="new-analysis" class="action-button" style="margin-left: auto;">New Chat</button>
          </div>
          <div class="chat-actions-secondary">
            <label class="screenshot-toggle" title="Capture a fresh chart screenshot with this message">
              <input type="checkbox" id="fresh-screenshot-toggle" />
              <span class="screenshot-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/></svg>
                Update chart caption
              </span>
            </label>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="../dist/sidepanel/sidepanel.js"></script>
  </body>
</html>
